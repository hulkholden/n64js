name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only publish newly created tags, not updates to existing tags.
    if: github.event.created == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
        env:
          BUILD_VERSION: ${{ github.ref_name }}
      - name: Stage site
        run: |
          mkdir _site
          cp index.html n64js.css _site/
          cp -R build js roms _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
